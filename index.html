<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le prix du carburant</title>
    <meta name="description" content="Calculer et comparer le coût au 100 km des véhicules thermiques et électriques." />
    <link rel="stylesheet" href="style.css" />
    <script src="plate.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">⚡</span>
          <span>Le prix du carburant</span>
        </div>
      </header>

      <p id="fuel-update-badge" class="update-badge" role="status" aria-live="polite">
        Chargement des données…
      </p>
      <p id="data-error" class="data-error" role="alert" hidden></p>

      <main class="container">
        <section class="panel" aria-labelledby="plate-heading">
          <h1 id="plate-heading">Tester une plaque française</h1>
          <form id="plate-form" class="plate-form" novalidate>
            <div class="field">
              <label for="plate-number">Plaque d’immatriculation (format SIV)</label>
              <input id="plate-number" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="AA-123-AA" aria-describedby="plate-result" />
            </div>
            <button type="submit">Vérifier</button>
          </form>
          <div class="plate-scan">
            <label class="scan-button" for="plate-photo">📷 Scanner une plaque (photo)</label>
            <input id="plate-photo" type="file" accept="image/*" capture="environment" hidden />
          </div>
          <p id="plate-result" class="plate-result" role="status" aria-live="polite"></p>
          <p id="plate-vehicle" class="plate-result" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
          <h1>Calculer le coût au 100 km</h1>

          <div class="form-grid">
            <div class="field">
              <label for="vehicle-type">Type de véhicule</label>
              <select id="vehicle-type">
                <option value="thermal">Thermique</option>
                <option value="electric">Électrique</option>
              </select>
            </div>
            <div class="field">
              <label for="brand">Marque</label>
              <select id="brand" disabled></select>
            </div>
            <div class="field">
              <label for="model">Modèle</label>
              <select id="model" disabled></select>
            </div>
            <div class="field">
              <label for="year">Année</label>
              <select id="year" disabled></select>
            </div>
            <div class="field">
              <label for="version">Version / finition</label>
              <select id="version" disabled></select>
            </div>
            <div class="field" id="fuel-field">
              <label for="fuel-price">Carburant</label>
              <select id="fuel-price">
                <option value="gazole">Gazole</option>
                <option value="sp95_e10">SP95-E10</option>
                <option value="sp98">SP98</option>
                <option value="e85">E85</option>
                <option value="gpl">GPL</option>
              </select>
            </div>
            <div class="field field-wide">
              <label for="consumption-custom">Ajuster ma consommation réelle (ordinateur de bord)</label>
              <input id="consumption-custom" type="number" step="0.1" min="0" inputmode="decimal" placeholder="Laisser vide pour utiliser la valeur constructeur" />
            </div>
          </div>

          <div class="section-row" id="electricity-fields" hidden>
            <div class="field">
              <label for="electricity-rate">Tarif électricité</label>
              <select id="electricity-rate"></select>
            </div>
            <div class="field" id="custom-electricity-field" hidden>
              <label for="custom-electricity-price">Tarif personnalisé (€/kWh)</label>
              <input id="custom-electricity-price" type="number" min="0" step="0.001" inputmode="decimal" placeholder="Saisir votre tarif" />
            </div>
          </div>

          <div class="summary">
            <div class="summary-card">
              <span>Consommation</span>
              <strong id="selected-consumption">—</strong>
            </div>
            <div class="summary-card">
              <span>Coût estimé</span>
              <strong id="cost-100km">—</strong>
            </div>
          </div>
          <p class="calculation-note">Pour l’électricité, le coût tient compte du coefficient de pertes indiqué dans le fichier des tarifs.</p>
        </section>

        <section class="panel comparison-panel">
          <h2>Comparatif des coûts</h2>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Type</th>
                  <th scope="col">Prix</th>
                  <th scope="col">Coût / 100 km</th>
                </tr>
              </thead>
              <tbody id="comparison-table"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
