<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le prix du carburant</title>
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="description" content="Calculer le coût exact au 100 km pour les véhicules thermiques et électriques." />
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --line: #dde6f0;
        --text: #102437;
        --muted: #53667c;
        --accent: #1c7cd6;
        --accent-soft: #eaf4ff;
        --warning-bg: #fff5d8;
        --warning-text: #7a5800;
        --shadow: 0 10px 28px rgba(16, 36, 55, 0.08);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(180deg, #eef3fa 0%, #f7f9fc 100%); color: var(--text); }
      .page-shell { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
      .topbar { display: flex; justify-content: center; margin-bottom: 18px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; }
      .brand-mark { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); border-radius: 12px; color: var(--accent); }
      .update-badge { display: block; max-width: fit-content; margin: 0 auto 20px; padding: 10px 16px; border: 1px solid #efd37e; border-radius: 999px; background: var(--warning-bg); color: var(--warning-text); font-size: 0.92rem; font-weight: 600; }
      .container { display: grid; gap: 22px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; }
      h1, h2 { margin: 0 0 20px; }
      .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field-wide { grid-column: span 3; }
      label { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
      input, select { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 14px; color: var(--text); font: inherit; }
      input:focus, select:focus { outline: 2px solid rgba(28, 124, 214, 0.15); border-color: var(--accent); }
      .section-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
      .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
      .summary-card { display: flex; flex-direction: column; gap: 8px; min-height: 110px; justify-content: center; background: #f5f9ff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
      .summary-card span { color: var(--muted); font-size: 0.9rem; }
      .summary-card strong { font-size: clamp(1.3rem, 2vw, 2rem); }
      .comparison-panel table { width: 100%; border-collapse: collapse; }
      .comparison-panel th, .comparison-panel td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
      .comparison-panel th { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      @media (max-width: 820px) {
        .form-grid, .section-row, .summary { grid-template-columns: 1fr; }
        .field-wide { grid-column: span 1; }
        .panel { padding: 18px 14px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">⚡</span>
          <span>Le prix du carburant</span>
        </div>
      </header>

      <div id="fuel-update-badge" class="update-badge">
        Prix des carburants mis à jour le 10/10/2026 à 12:00
      </div>

      <main class="container">
        <section class="panel">
          <h1>Calculer le coût réel au 100 km</h1>

          <div class="form-grid">
            <div class="field">
              <label for="vehicle-type">Type de véhicule</label>
              <select id="vehicle-type">
                <option value="thermal">Thermique</option>
                <option value="electric">Électrique</option>
              </select>
            </div>
            <div class="field">
              <label for="brand">Marque</label>
              <select id="brand"></select>
            </div>
            <div class="field">
              <label for="model">Modèle</label>
              <select id="model"></select>
            </div>
            <div class="field">
              <label for="year">Année</label>
              <select id="year"></select>
            </div>
            <div class="field">
              <label for="version">Version / finition</label>
              <select id="version"></select>
            </div>
            <div class="field">
              <label for="fuel-price">Carburant</label>
              <select id="fuel-price">
                <option value="gazole">Gazole</option>
                <option value="sp95_e10">SP95-E10</option>
                <option value="sp98">SP98</option>
                <option value="e85">E85</option>
                <option value="gpl">GPL</option>
              </select>
            </div>
            <div class="field field-wide">
              <label for="consumption-custom">Ajuster ma consommation réelle (ordinateur de bord)</label>
              <input id="consumption-custom" type="number" step="0.1" min="0" placeholder="Laisse vide pour utiliser la valeur constructeur" />
            </div>
          </div>

          <div class="section-row">
            <div class="field field-wide">
              <label for="plate-photo">Plaque d'immatriculation (photo)</label>
              <input id="plate-photo" type="file" accept="image/*" capture="environment" />
              <input id="plate-text" type="text" placeholder="AB-123-CD" maxlength="12" autocapitalize="characters" />
              <button id="plate-save" type="button">Associer cette plaque au véhicule sélectionné</button>
              <p id="plate-status" role="status" aria-live="polite"></p>
            </div>
          </div>

          <div class="section-row">
            <div class="field">
              <label for="electricity-rate">Tarif électricité (si électrique)</label>
              <select id="electricity-rate">
                <option value="edf_blue_base">EDF Bleu - Base (0,2167 €/kWh)</option>
                <option value="edf_blue_off_peak">EDF Bleu - Heures Creuses (0,1637 €/kWh)</option>
                <option value="edf_tempo_blue">EDF Tempo - Bleu (0,1918 €/kWh)</option>
                <option value="edf_tempo_white">EDF Tempo - Blanc (0,2821 €/kWh)</option>
                <option value="edf_tempo_red">EDF Tempo - Rouge (0,7526 €/kWh)</option>
                <option value="public_ac">Borne AC publique (0,35 €/kWh)</option>
                <option value="public_dc">Borne DC rapide autoroute (0,59 €/kWh)</option>
                <option value="custom">Tarif personnalisé</option>
              </select>
            </div>
            <div class="field">
              <label for="custom-electricity-price">Tarif personnalisé (€/kWh)</label>
              <input id="custom-electricity-price" type="number" step="0.001" placeholder="0.20" />
            </div>
          </div>

          <div class="summary">
            <div class="summary-card">
              <span>Consommation</span>
              <strong id="selected-consumption">-- L/100 km</strong>
            </div>
            <div class="summary-card">
              <span>Coût estimé</span>
              <strong id="cost-100km">-- € / 100 km</strong>
            </div>
          </div>
        </section>

        <section class="panel comparison-panel">
          <h2>Comparatif des coûts</h2>
          <table>
            <thead>
              <tr>
                <th>Type</th>
                <th>Prix</th>
                <th>Coût / 100 km</th>
              </tr>
            </thead>
            <tbody id="comparison-table"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script>
      const vehicleData = {
        thermal: [
          { brand: "Renault", model: "Grand Scénic IV", year: 2020, version: "1.7 Blue dCi 120 ch", consumption: 5.2 },
          { brand: "Renault", model: "Clio V", year: 2023, version: "1.0 TCe 100 ch", consumption: 4.8 },
          { brand: "Peugeot", model: "308", year: 2023, version: "1.2 PureTech 130 ch", consumption: 5.1 },
          { brand: "Citroën", model: "C5 Aircross", year: 2022, version: "1.5 Blue HDi 130 ch", consumption: 4.9 },
          { brand: "Toyota", model: "Yaris", year: 2023, version: "1.5 Hybrid", consumption: 3.4 }
        ],
        electric: [
          { brand: "Tesla", model: "Model 3", year: 2023, version: "RWD 18\"", consumption: 14.8 },
          { brand: "Renault", model: "Zoé", year: 2023, version: "Life 17\"", consumption: 16.0 },
          { brand: "Volkswagen", model: "ID.3", year: 2023, version: "Pro 18\"", consumption: 15.5 },
          { brand: "Hyundai", model: "Kona Electric", year: 2023, version: "Standard 17\"", consumption: 17.0 },
          { brand: "BMW", model: "i4", year: 2023, version: "eDrive35 19\"", consumption: 16.8 }
        ]
      };

      // Prix ACTUELS EN FRANCE (10/10/2026)
      let prices = { gazole: 2.345, sp95_e10: 2.14, sp98: 2.235, e85: 0.91, gpl: 1.055 };
      
      const rates = { 
        edf_blue_base: 0.2167, 
        edf_blue_off_peak: 0.1637, 
        edf_tempo_blue: 0.1918, 
        edf_tempo_white: 0.2821, 
        edf_tempo_red: 0.7526, 
        public_ac: 0.35, 
        public_dc: 0.59, 
        custom: 0.2 
      };

      const vehicleType = document.getElementById("vehicle-type");
      const brandSelect = document.getElementById("brand");
      const modelSelect = document.getElementById("model");
      const yearSelect = document.getElementById("year");
      const versionSelect = document.getElementById("version");
      const fuelPriceSelect = document.getElementById("fuel-price");
      const electricityRateSelect = document.getElementById("electricity-rate");
      const customElectricityPrice = document.getElementById("custom-electricity-price");
      const consumptionCustom = document.getElementById("consumption-custom");
      const selectedConsumption = document.getElementById("selected-consumption");
      const cost100km = document.getElementById("cost-100km");
      const comparisonTable = document.getElementById("comparison-table");
      const fuelUpdateBadge = document.getElementById("fuel-update-badge");

      function getVehicles() {
        return vehicleData[vehicleType.value] || vehicleData.thermal;
      }

      function populateBrandOptions() {
        const brands = [...new Set(getVehicles().map((v) => v.brand))].sort();
        brandSelect.innerHTML = "";
        brands.forEach((brand) => {
          const option = document.createElement("option");
          option.value = brand;
          option.textContent = brand;
          brandSelect.appendChild(option);
        });
        if (brandSelect.options.length) {
          brandSelect.value = brandSelect.options[0].value;
          populateModelOptions();
        }
      }

      function populateModelOptions() {
        const models = [...new Set(
          getVehicles()
            .filter((v) => v.brand === brandSelect.value)
            .map((v) => v.model)
        )].sort();
        modelSelect.innerHTML = "";
        models.forEach((model) => {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });
        if (modelSelect.options.length) {
          modelSelect.value = modelSelect.options[0].value;
          populateYearOptions();
        }
      }

      function populateYearOptions() {
        const years = [...new Set(
          getVehicles()
            .filter((v) => v.brand === brandSelect.value && v.model === modelSelect.value)
            .map((v) => v.year)
        )].sort((a, b) => b - a);
        yearSelect.innerHTML = "";
        years.forEach((year) => {
          const option = document.createElement("option");
          option.value = year;
          option.textContent = year;
          yearSelect.appendChild(option);
        });
        if (yearSelect.options.length) {
          yearSelect.value = yearSelect.options[0].value;
          populateVersionOptions();
        }
      }

      function populateVersionOptions() {
        const versions = getVehicles().filter(
          (v) => v.brand === brandSelect.value && v.model === modelSelect.value && Number(v.year) === Number(yearSelect.value)
        );
        versionSelect.innerHTML = "";
        versions.forEach((vehicle) => {
          const option = document.createElement("option");
          option.value = vehicle.version;
          option.textContent = vehicle.version;
          versionSelect.appendChild(option);
        });
        if (versionSelect.options.length) {
          versionSelect.value = versionSelect.options[0].value;
        }
        updateCalculation();
      }

      function getCurrentVehicle() {
        const vehicles = getVehicles().filter(
          (v) => v.brand === brandSelect.value && v.model === modelSelect.value && Number(v.year) === Number(yearSelect.value)
        );
        return vehicles.find((v) => v.version === versionSelect.value) || vehicles[0];
      }

      function getConsumption() {
        const custom = Number(consumptionCustom.value);
        if (Number.isFinite(custom) && custom > 0) return custom;
        const vehicle = getCurrentVehicle();
        return vehicle ? Number(vehicle.consumption) : 0;
      }

      function getElectricityRate() {
        const selected = electricityRateSelect.value;
        if (selected === "custom") {
          const value = Number(customElectricityPrice.value);
          return Number.isFinite(value) && value > 0 ? value : 0.2;
        }
        return rates[selected] ?? 0.2167;
      }

      function calculateCost100km() {
        const consumption = getConsumption();
        if (vehicleType.value === "thermal") {
          const fuelKey = fuelPriceSelect.value;
          return consumption * (prices[fuelKey] ?? 2.0);
        }
        return consumption * 1.12 * getElectricityRate();
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
      }

      function updateCalculation() {
        const consumption = getConsumption();
        const cost = calculateCost100km();
        const unit = vehicleType.value === "thermal" ? "L/100 km" : "kWh/100 km";
        selectedConsumption.textContent = `${consumption.toFixed(1)} ${unit}`;
        cost100km.textContent = `${formatCurrency(cost)} / 100 km`;
        renderComparison();
      }

      function renderComparison() {
        const rows = [
          ["Gazole", "€/L", prices.gazole || 2.345],
          ["SP95-E10", "€/L", prices.sp95_e10 || 2.14],
          ["SP98", "€/L", prices.sp98 || 2.235],
          ["E85", "€/L", prices.e85 || 0.91],
          ["GPL", "€/L", prices.gpl || 1.055],
          ["Recharge domicile", "€/kWh", rates.edf_blue_base],
          ["Recharge autoroute", "€/kWh", rates.public_dc],
        ];
        comparisonTable.innerHTML = "";
        rows.forEach(([label, unit, price]) => {
          const consumption = getConsumption();
          const cost = unit === "€/L" ? consumption * price : consumption * 1.12 * price;
          const row = document.createElement("tr");
          row.innerHTML = `<td>${label}</td><td>${formatCurrency(price)}/${unit.split("/")[1]}</td><td>${formatCurrency(cost)}</td>`;
          comparisonTable.appendChild(row);
        });
      }

      vehicleType.addEventListener("change", () => {
        populateBrandOptions();
        updateCalculation();
      });
      brandSelect.addEventListener("change", populateModelOptions);
      modelSelect.addEventListener("change", populateYearOptions);
      yearSelect.addEventListener("change", populateVersionOptions);
      versionSelect.addEventListener("change", updateCalculation);
      consumptionCustom.addEventListener("input", updateCalculation);
      fuelPriceSelect.addEventListener("change", updateCalculation);
      electricityRateSelect.addEventListener("change", updateCalculation);
      customElectricityPrice.addEventListener("input", updateCalculation);

      // Lecture de plaque par photo (OCR Tesseract.js chargé à la demande)
      const plateInput = document.getElementById("plate-photo");
      const plateText = document.getElementById("plate-text");
      const plateSave = document.getElementById("plate-save");
      const plateStatus = document.getElementById("plate-status");
      const PLATE_STORE = "plates_v1";

      function normalizePlate(raw) {
        const t = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        const m = t.match(/[A-Z]{2}\d{3}[A-Z]{2}/);
        return m ? `${m[0].slice(0, 2)}-${m[0].slice(2, 5)}-${m[0].slice(5)}` : "";
      }

      function loadPlates() {
        try { return JSON.parse(localStorage.getItem(PLATE_STORE)) || {}; } catch (e) { return {}; }
      }

      function applyPlate(plate) {
        const known = loadPlates()[plate];
        if (!known) {
          plateStatus.textContent = `Plaque ${plate} lue. Choisis le véhicule puis associe-le.`;
          return;
        }
        vehicleType.value = known.type;
        populateBrandOptions();
        brandSelect.value = known.brand; populateModelOptions();
        modelSelect.value = known.model; populateYearOptions();
        yearSelect.value = known.year; populateVersionOptions();
        versionSelect.value = known.version;
        updateCalculation();
        plateStatus.textContent = `Plaque ${plate} : ${known.brand} ${known.model} sélectionné.`;
      }

      function loadTesseract() {
        if (window.Tesseract) return Promise.resolve(window.Tesseract);
        return new Promise((resolve, reject) => {
          const el = document.createElement("script");
          el.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
          el.onload = () => resolve(window.Tesseract);
          el.onerror = () => reject(new Error("OCR indisponible (réseau)"));
          document.head.appendChild(el);
        });
      }

      plateInput.addEventListener("change", async () => {
        const file = plateInput.files && plateInput.files[0];
        if (!file) return;
        plateStatus.textContent = "Lecture de la plaque en cours…";
        try {
          const T = await loadTesseract();
          const url = URL.createObjectURL(file);
          try {
            const { data } = await T.recognize(url, "eng");
            const plate = normalizePlate(data.text);
            if (plate) {
              plateText.value = plate;
              applyPlate(plate);
            } else {
              plateStatus.textContent = "Plaque non reconnue. Saisis-la manuellement (AB-123-CD).";
            }
          } finally {
            URL.revokeObjectURL(url);
          }
        } catch (err) {
          plateStatus.textContent = `${err.message}. Saisis la plaque manuellement.`;
        } finally {
          plateInput.value = "";
        }
      });

      plateText.addEventListener("change", () => {
        const plate = normalizePlate(plateText.value);
        if (plate) { plateText.value = plate; applyPlate(plate); }
        else plateStatus.textContent = "Format attendu : AB-123-CD.";
      });

      plateSave.addEventListener("click", () => {
        const plate = normalizePlate(plateText.value);
        if (!plate) { plateStatus.textContent = "Plaque invalide (AB-123-CD)."; return; }
        const plates = loadPlates();
        plates[plate] = {
          type: vehicleType.value, brand: brandSelect.value, model: modelSelect.value,
          year: yearSelect.value, version: versionSelect.value
        };
        try { localStorage.setItem(PLATE_STORE, JSON.stringify(plates)); plateStatus.textContent = `Plaque ${plate} enregistrée.`; }
        catch (e) { plateStatus.textContent = "Enregistrement impossible."; }
      });

      // Initialiser
      populateBrandOptions();
      updateCalculation();
    </script>
  </body>
</html>
