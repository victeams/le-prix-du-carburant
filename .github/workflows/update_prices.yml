name: Update fuel prices

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch fuel prices
        run: python scripts/fetch_fuel_prices.py

      - name: Validate data
        run: python scripts/validate_prices.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "Aucun changement dans data/prices.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "chore: update fuel prices"
          git push
