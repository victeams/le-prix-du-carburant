name: Update fuel prices

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fuel-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and validate current prices
        run: python scripts/fetch_fuel_prices.py

      - name: Commit updated prices
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "Les données vérifiées n'ont pas changé ; aucun commit nécessaire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update verified fuel prices"
          git push
